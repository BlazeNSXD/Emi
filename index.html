<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
  font-family: Arial, sans-serif;
  color:#f2c6da;
}

/* ===== MENU ===== */
#menuBtn{
  position:fixed;
  top:14px;
  left:14px;
  z-index:20;
  font-size:26px;
  color:#f2c6da;
  opacity:.7;
}

#menu{
  position:fixed;
  top:0;
  left:0;
  width:70%;
  height:100%;
  background:rgba(10,10,10,.96);
  z-index:19;
  transform:translateX(-100%);
  transition:.4s;
  padding:60px 20px;
}

#menu a{
  display:block;
  margin-bottom:20px;
  font-size:18px;
  text-decoration:none;
  color:#f2c6da;
  opacity:.8;
}

/* ===== SECTIONS ===== */
.section{
  position:fixed;
  inset:0;
  display:none;
  z-index:6;
  background:rgba(0,0,0,.6);
  overflow-y:auto;
}

.section.active{
  display:block;
}

/* ===== CALENDAR ===== */
.memory{
  margin:20px;
}

.memory img{
  width:100%;
  border-radius:6px;
  margin-bottom:8px;
}

/* ===== MUSIC ===== */
.song{
  margin:20px;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

/* ===== INTRO ===== */
#intro{
  position:fixed;
  inset:0;
  background:#0b0b0b;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
  transition:opacity 1.2s;
}

.cover img{
  width:220px;
  height:220px;
  object-fit:cover;
  border-radius:6px;
  box-shadow:0 0 25px rgba(255,120,180,.35);
}

/* ===== HEART & FX ===== */
#heart{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:4;
}

#heart svg{
  width:220px;
  height:220px;
  fill:none;
  stroke:#ff4f86;
  stroke-width:2;
}

#emi{
  position:fixed;
  bottom:17%;
  width:100%;
  text-align:center;
  font-size:30px;
  opacity:0;
  transition:.4s;
  z-index:5;
}
</style>
</head>

<body>

<div id="menuBtn">☰</div>

<div id="menu">
  <a onclick="openSection('inicio')">Inicio</a>
  <a onclick="openSection('calendar')">Calendario</a>
  <a onclick="openSection('music')">Música</a>
</div>

<!-- INTRO -->
<div id="intro">
  <div class="cover">
    <img src="cover.jpg">
    <p style="text-align:center;opacity:.6">toca para comenzar</p>
  </div>
</div>

<!-- SECTIONS -->
<div id="calendar" class="section">
  <div class="memory">
    <img src="cal1.jpg">
    <p>La mejor carta del mundo 💗</p>
  </div>
  <div class="memory">
    <img src="cal2.jpg">
    <p>Cartita de mis sentimiento💗</p>
  </div>
</div>

<div id="music" class="section">
  <div class="song">Angel – Massive Attack</div>
  <div class="song">Lovers Rock – TV Girl</div>
  <div class="song">Blue Hair – TV Girl</div>
</div>

<div id="heart">
  <svg viewBox="0 0 24 24">
    <path d="M12 21s-7-4.6-10-9.5C-1 6.5 4 2 8 5c2 1.7 4 4 4 4s2-2.3 4-4c4-3 9 1.5 6 6.5C19 16.4 12 21 12 21z"/>
  </svg>
</div>

<div id="emi">Emi&lt;3</div>

<audio id="musicAudio" loop>
  <source src="angel.mp3" type="audio/mpeg">
</audio>

<script>
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=()=>{
  menu.style.transform=menu.style.transform?"":"translateX(0)";
};

function openSection(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  if(id!=="inicio"){
    document.getElementById(id).classList.add("active");
  }
  menu.style.transform="translateX(-100%)";
}

let started=false;
const music=document.getElementById("musicAudio");
const emi=document.getElementById("emi");

document.body.addEventListener("click",()=>{
  if(!started){
    document.getElementById("intro").style.opacity=0;
    setTimeout(()=>document.getElementById("intro").remove(),1200);
    music.play().catch(()=>{});
    started=true;
  }
  emi.style.opacity=1;
  setTimeout(()=>emi.style.opacity=0,600);
});
</script>

</body>
</html>
